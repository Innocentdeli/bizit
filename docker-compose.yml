services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  # Placeholder for backend/frontend if needed in compose later
  # backend:
  #   build: ./backend
  # frontend:
  #   build: ./frontend
