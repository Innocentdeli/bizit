services:
  # ==========================================
  # 1. CORE INFRASTRUCTURE (Always Available)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: bizit_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bizit_rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    restart: unless-stopped

  neo4j:
    image: neo4j:5.16
    container_name: bizit_neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: bizit_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-bizit}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    restart: unless-stopped

  # ==========================================
  # 2. APPLICATION SERVICES (Profile: full)
  # ==========================================
  bizit-core:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bizit_core
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      neo4j:
        condition: service_started
      postgres:
        condition: service_started
    environment:
      - USE_REDIS=true
      - REDIS_HOST=redis
      - NEO4J_URI=bolt://neo4j:7687
      - RABBITMQ_HOST=rabbitmq
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-bizit}
    command: ["python", "backend/main_loop.py"]
    restart: always

  bizit-api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bizit_api
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "${API_PORT:-8002}:8002"
    environment:
      - USE_REDIS=true
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-bizit}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    restart: always

  bizit-dashboard:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/dashboard/Dockerfile
    container_name: bizit_dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - bizit-api
    restart: always
